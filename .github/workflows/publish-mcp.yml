# Publishes server.json to the official MCP Registry when it changes on main
# (or by hand from the Actions tab). Signs in with GitHub's OIDC token, which
# the registry accepts for the io.github.jtbrazil07-oss namespace. Bump
# "version" in server.json first: the registry refuses a version it has.
name: Publish to the MCP Registry
on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Sign in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
